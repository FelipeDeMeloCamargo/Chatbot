<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Magalu - n8n</title>

    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/style.css" rel="stylesheet" />

    <style>
        :root {
            /* Cores - Azul Magalu */
            --chat--color--primary: #0086FF;
            --chat--color--primary-shade-50: #007BEB;
            --chat--color--primary--shade-100: #0069CC;
            --chat--color--secondary: #0086FF;
            --chat--color-secondary-shade-50: #007BEB;
            --chat--color-white: #ffffff;
            --chat--color-light: #f7f9fc;
            --chat--color-light-shade-50: #eef1f6;
            --chat--color-light-shade-100: #d6dbe5;
            --chat--color-medium: #c2c8d6;
            --chat--color-dark: #2b3a4a;
            --chat--color-disabled: #d6dbe5;
            --chat--color-typing: #0086FF;

            /* Layout Arredondado */
            --chat--spacing: 1rem;
            --chat--border-radius: 1.25rem;
            --chat--font-family: 'Nunito', 'Poppins', sans-serif;

            --chat--window--width: 400px;
            --chat--window--height: 600px;
            --chat--window--border-radius: 1.5rem;

            --chat--header--background: var(--chat--color--primary);
            --chat--header--color: var(--chat--color-white);
            --chat--heading--font-size: 1.5em;

            --chat--message--padding: 0.8rem 1.2rem;
            --chat--message--border-radius: 1.25rem;
            --chat--message--bot--background: var(--chat--color-white);
            --chat--message--bot--border: 1px solid var(--chat--color-light-shade-50);
            --chat--message--user--background: var(--chat--color--secondary);

            --chat--input--border-radius: 2rem;
            --chat--toggle--background: var(--chat--color--primary);
        }

        .chat-message {
            max-width: 85%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body style="background-color: #f0f0f0; margin: 0; font-family: sans-serif;">

    <script type="module">
        import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat@1/+esm';

        createChat({
            // URL ajustada para o formato de Webhook (sem o /chat no final)
            webhookUrl: 'https://n8n-automacao.luizalabs.com/webhook/7a04e5a6-df64-41d6-8fac-77300432bd9e/chat',

            /* Mensagens iniciais em Português */
            initialMessages: [
                'Olá! Bem-vindo ao Magalu! 💙',
                'Como posso te ajudar hoje?'
            ],

            /* Tradução da interface */
            i18n: {
                en: {
                    title: 'Olá! Como posso ajudar? 👋',
                    subtitle: 'Fale com a nossa equipe. Estamos aqui para você.',
                    getStarted: 'Nova conversa',
                    inputPlaceholder: 'Digite sua mensagem...',
                }
            }
        });
    </script>

</body>

</html>
